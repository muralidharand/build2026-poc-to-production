# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: nodues-coordinator
description: |
  Long-running no-dues coordinator for Kovai Institute of Technology (KIT). Checks student dues across departments, gates the final certificate behind human-in-the-loop officer approval, and persists the dossier so the workflow survives scale-to-zero.
metadata:
  tags:
    - Campus No-Dues
    - Long-Running Agent
    - Responses Protocol
    - Activity Protocol
    - Teams
protocols:
  - protocol: responses
    version: 1.0.0
  # Activity protocol enables Teams: the platform passes the raw Bot Framework
  # Activity through to the container's POST /api/messages (no responses<->activity
  # mapper). The agent's Entra Agent ID is the bot identity; the platform provisions
  # the bot whose messaging endpoint is .../endpoint/protocols/activityProtocol.
  - protocol: activity_protocol
    version: 1.0.0
resources:
  cpu: "1"
  memory: 2Gi
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: gpt-5
  - name: APPROVAL_SERVER_PORT
    value: "8090"
  - name: ENABLE_INSTRUMENTATION
    value: "true"
  - name: ENABLE_SENSITIVE_DATA
    value: "true"

  # ── Optional: Durable Task Scheduler (human-in-the-loop approval workflow) ──
  # When set, approval-gated certificate requests run through a durable orchestration
  # so they survive scale-to-zero. If unset, the agent uses an in-process fallback.
  # - name: DURABLE_TASK_ENDPOINT
  #   value: https://<your-dts-resource>.<region>.durabletask.io
  # - name: DURABLE_TASK_TASKHUB
  #   value: <your-taskhub-name>

  # ── Optional: Teams (Activity Protocol) proactive messaging ──
  # APPROVER_UPN is the officer who receives proactive approval cards.
  # TEAMS_STATE_BLOB_URL is a shared Azure Blob container that stores the Teams
  # conversation mapping so the heartbeat (a different session) can DM the officer.
  # If unset, a session-local file fallback is used (single-session only).
  # - name: APPROVER_UPN
  #   value: <officer-upn@your-tenant>
  # - name: TEAMS_STATE_BLOB_URL
  #   value: https://<account>.blob.core.windows.net/teams-state
