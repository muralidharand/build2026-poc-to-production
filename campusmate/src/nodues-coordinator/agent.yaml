kind: hosted
name: nodues-coordinator
description: >
  No-Dues Coordinator for Kovai Institute of Technology — manages human-in-the-loop
  approval for no-dues certificates using durable orchestration and a web approval UI.

protocols:
  - type: responses
    version: "1.0.0"
  - type: activity_protocol
    description: Microsoft Teams activity handler

container:
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1
  APPROVAL_SERVER_PORT: "8090"
  ENABLE_INSTRUMENTATION: "true"
  ENABLE_SENSITIVE_DATA: "true"
  # DURABLE_TASK_ENDPOINT: ""
  # DURABLE_TASK_TASKHUB: campusmate-approvals
  # APPROVER_UPN: ""
  # TEAMS_STATE_BLOB_URL: ""
  # TEAMS_APP_ID: ""
  # TEAMS_APP_PASSWORD: ""
  # TEAMS_TENANT_ID: ""
