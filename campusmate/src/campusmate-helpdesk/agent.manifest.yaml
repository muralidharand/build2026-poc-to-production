name: campusmate-helpdesk
displayName: "CampusMate Helpdesk"
description: >
  Voice-enabled campus helpdesk assistant for students at Kovai Institute of Technology (KIT).
  Built on the Microsoft Agent Framework with FoundryChatClient, an optional
  MCP Toolbox connection, and local function tools that return sample data.
metadata:
  tags:
    - Campus Helpdesk
    - Voice
    - Responses Protocol
    - Agent Framework
template:
  name: campusmate-helpdesk
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: MODEL_DEPLOYMENT_NAME
      value: "gpt-5"
resources:
  - kind: model
    id: gpt-5
    name: MODEL_DEPLOYMENT_NAME
